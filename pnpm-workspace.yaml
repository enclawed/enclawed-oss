packages:
  - .
  - ui
  - packages/*
  - extensions/*
  - enclawed-apps/*
  # qa-matrix references @enclawed/matrix which was stripped from this fork
  # (cloud channel removed by the enclaved-flavor security policy). The
  # dangling QA fixture is excluded from the workspace.
  - "!extensions/qa-matrix"

# Per-install platform scoping. Without this, pnpm dutifully downloads
# every platform-specific binary that any workspace package declares as
# an optional dep — sharp/napi-canvas/codex/llama-cpp/lancedb/rolldown/
# typescript-native each ship 8–12 OS×arch×libc variants, which on a
# fresh install pulls ~2 GB of binaries that will never run because the
# matching one is already on disk. `current` collapses each set to the
# single (os, cpu, libc) tuple of the machine running pnpm install.
supportedArchitectures:
  os:
    - current
  cpu:
    - current
  libc:
    - current

minimumReleaseAge: 2880

minimumReleaseAgeExclude:
  - "acpx"
  - "axios"
  - "basic-ftp"
  - "hono"
  - "enclawed"
  - "protobufjs"
  - "@buape/carbon"
  - "vite"
  - "@cloudflare/workers-types"
  - "@hono/node-server"
  - "@mariozechner/*"
  - "@typescript/native-preview*"
  - "@types/node"
  - "@rolldown/*"
  - "@oxlint/*"
  - "@oxfmt/*"
  - "axios@1.15.0"
  - "discord-api-types"
  - "rolldown"
  - "sqlite-vec"
  - "sqlite-vec-*"

onlyBuiltDependencies:
  # Built on macOS/Windows so the enclaweder hardware root can be
  # driven there; Linux uses /dev/hidraw and needs no native module.
  - node-hid
  - "@discordjs/opus"
  - "@lydell/node-pty"
  - "@matrix-org/matrix-sdk-crypto-nodejs"
  - "@napi-rs/canvas"
  - "@tloncorp/api"
  - "@tloncorp/tlon-skill"
  - "@whiskeysockets/baileys"
  - authenticate-pam
  - esbuild
  - node-llama-cpp
  - protobufjs
  - sharp

ignoredBuiltDependencies:
  - koffi

# Version pins migrated from the now-ignored package.json `pnpm.overrides`
# block.  Every entry here is either (a) a CVE-driven pin or (b) a known
# floor for upstream regressions.  Bumping or removing any of these is a
# security-relevant change — review against the audit log before touching.
overrides:
  "@anthropic-ai/sdk": "0.91.1"
  # CVE-driven floor. 4.12.21 patches four moderate advisories published
  # 2026-06-04: GHSA-xrhx-7g5j-rcj5 (ipRestriction bypass for non-canonical
  # IPv6), GHSA-2gcr-mfcq-wcc3 (app.mount() undecoded-path prefix strip),
  # GHSA-f577-qrjj-4474 (JWT middleware accepts any Authorization scheme),
  # GHSA-3hrh-pfw6-9m5x (cookie sameSite/priority Set-Cookie injection).
  # Pinned to 4.12.27 to also carry GHSA fixes published 2026-06/07:
  # CORS credentialed-origin reflection, serve-static Windows path
  # traversal, and the AWS Lambda/Edge Set-Cookie + body-limit bypasses
  # (all patched in 4.12.25; 4.12.27 is latest 4.12.x).
  hono: "^4.12.34"
  "@hono/node-server": "^1.19.15"
  axios: "^1.18.0"
  # GHSA-2h32-95rg-cppp (critical): Vitest browser mode served the
  # otelCarrier query parameter unsanitized as inline script. First
  # patched in 4.1.6. Test/supply-chain.spec.ts trips if anyone
  # downgrades below 4.1.6.
  vitest: "^4.1.9"
  "@vitest/coverage-v8": "^4.1.9"
  "@vitest/browser-playwright": "^4.1.9"
  # GHSA (critical): Vitest browser-mode exposed API could be proxied by
  # a malicious page (vulnerable <=4.1.7). Patched >=4.1.8; the vitest
  # family pins above do not reach @vitest/browser transitively, so pin
  # it explicitly.
  "@vitest/browser": "^4.1.10"
  follow-redirects: "1.16.0"
  # html-encoding-sniffer@6 dropped whatwg-encoding (whole-package
  # deprecated) and uses @exodus/bytes instead. Pinning here forces
  # jsdom (vitest dev-dep) and any other consumer off the deprecated
  # transitive.
  html-encoding-sniffer: "^6"
  defu: "6.1.5"
  fast-xml-parser: "5.7.0"
  request: "npm:@cypress/request@3.0.10"
  request-promise: "npm:@cypress/request-promise@5.0.0"
  basic-ftp: "5.3.1"
  file-type: "22.0.1"
  # form-data 2.x is deprecated upstream; 4.x has the same security
  # fixes plus a maintained release line. The 2.x pin used to be here
  # for compat with an older consumer that no longer ships. Floor raised
  # to 4.0.6 for GHSA form-data CRLF injection (unescaped boundary,
  # vulnerable <4.0.6).
  form-data: "^4.0.6"
  minimatch: "10.2.4"
  path-to-regexp: "8.4.0"
  # qs array-limit bypass: bracket-key comma parsing lets an attacker exceed
  # the configured array limit (vulnerable >=6.14.2 <=6.15.3). Patched
  # 6.16.0; floor raised rather than pinned so the next patch is picked up.
  qs: "^6.16.0"
  node-domexception: "npm:@nolyfill/domexception@^1.0.28"
  "@sinclair/typebox": "0.34.49"
  # node-tar PAX size-override applied to intermediary entries (vulnerable
  # <=7.5.15); patched >=7.5.16, pinned to latest 7.5.x.
  tar: "^7.5.21"
  tough-cookie: "4.1.3"
  yauzl: "3.2.1"
  # protobufjs unbounded-alloc DoS (<=7.6.0) + schema-name shadowing of
  # runtime globals (<=7.6.2); patched >=7.6.3, pinned to latest 7.6.x.
  protobufjs: "^7.6.5"
  brace-expansion: "^5.0.9"
  # ws memory-exhaustion DoS from many tiny fragments (vulnerable <8.21.0).
  "ws@>=8.0.0 <8.21.0": "8.21.0"
  # fast-uri: four advisories published 2026-09-03 -- SSRF via malformed and
  # via repeated components, host confusion via percent-encoded scheme, and
  # host confusion via skipped IDN canonicalisation. The 3.x line is
  # vulnerable <3.1.6. This one matters more than most here: the product
  # gates egress on host identity, and a URI parser that disagrees with the
  # network stack about the host is exactly the shape of bug that walks
  # through such a gate.
  fast-uri: "^3.1.6"
  fast-xml-builder: "1.1.7"
  "@opentelemetry/sdk-node": "^0.217.0"
  "@opentelemetry/exporter-prometheus": "^0.217.0"
  uuid: "13.0.1"
  ip-address: "^10.3.1"
  # Deprecated-transitive cleanup. Each entry is the latest non-deprecated
  # version of a package whose previous transitive resolution triggered a
  # pnpm deprecation warning. Bumping any of these is verified to keep
  # the install green before the snapshot — if a consumer breaks on a
  # newer major, narrow this rule and pin the offending parent instead.
  "@smithy/util-retry": "^4.4"
  # nodemailer: earlier <8.0.9 SMTP command-injection floor superseded by
  # GHSA against <=9.0.0 (message-level `raw` option bypasses disabled
  # file access); patched >=9.0.1. Bumped to the 9.x line — repo is Node
  # >=22 and the only consumer (executive assistant) uses the stable
  # createTransport/sendMail SMTP surface, unchanged in v9. Lands on
  # 9.0.1 (patched) — 9.0.2/9.0.3 are under the 48h release-age gate.
  nodemailer: "^9.0.1"
  # glob older than 13 is deprecated for known CVEs; 13.x is the
  # maintained line.
  glob: "^13"
  rimraf: "^6"
  # node-gyp 11+ dropped the npm-internal logging cluster
  # (npmlog, gauge, are-we-there-yet, inflight). Pinning here
  # forces every native-builder consumer to use the new tree.
  node-gyp: "^11"
  # @discordjs/opus ships its own fork of node-pre-gyp pinned at 0.4.x,
  # which in turn drags in the deprecated npmlog / gauge /
  # are-we-there-yet cluster. The upstream successor is the actively
  # maintained @mapbox/node-pre-gyp; pnpm understands the `npm:`
  # prefix to swap the name. Discord channel is not used by the
  # executive assistant; opusscript covers the audio side.
  "@discordjs/node-pre-gyp": "npm:@mapbox/node-pre-gyp@^2"
  # has-own was deprecated in favour of Object.hasOwn(); `hasown` is
  # the official maintained alternative with a compatible surface.
  has-own: "npm:hasown@^2"
  # The @mariozechner/pi-* family was renamed upstream to
  # @earendil-works/pi-*. The 0.73.x line of the old name still
  # publishes a deprecation pointing at the new name; redirect every
  # consumer at the new package.
  # The @mariozechner/pi-* family was renamed upstream to
  # @earendil-works/pi-*. The 0.73.x line of the old name still
  # publishes a deprecation pointing at the new name; redirect every
  # consumer at the new package.
  #
  # NOTE (2026-07-01): the old 0.75.5 resolution carried four
  # @earendil-works/pi-coding-agent advisories; the last, a moderate
  # (GHSA-mqxh-6gq7-558m, project-local extension autoload without
  # approval), is only patched at 0.79.0. Pinned to 0.80.2 — the latest
  # release that clears the 48h minimumReleaseAge gate and the line
  # upstream's own coding-agent currently ships on — so ALL four
  # advisories are fixed.
  #
  # pi-ai 0.79+ removed its global provider registry
  # (registerApiProvider/clearApiProviders/...), the standalone per-API
  # stream functions (streamAnthropic/streamOpenAIResponses/...), and
  # getApiProvider/getModel from the package's main entry, replacing them
  # with the stateful Models/Provider object model. The enclawed core is
  # built on the old primitives, so the removed symbols are imported from
  # the upstream-provided "@mariozechner/pi-ai/compat" entrypoint (a strict
  # superset of the main entry that upstream's own coding-agent still uses
  # until its ModelManager migration lands). Rearchitecting enclawed onto
  # the new Models API is deferred until that upstream API stabilises.
  # All three move in lockstep — coding-agent 0.80.2 requires the family
  # (pi-ai/pi-agent-core/pi-tui) at ^0.80.2.
  "@mariozechner/pi-agent-core": "npm:@earendil-works/pi-agent-core@0.80.2"
  "@mariozechner/pi-ai": "npm:@earendil-works/pi-ai@0.80.2"
  "@mariozechner/pi-coding-agent": "npm:@earendil-works/pi-coding-agent@0.80.2"

  # --- CVE-driven pins added 2026-07-01 (Dependabot sweep) ---
  # @grpc/grpc-js: malformed request / malformed compressed message can
  # crash the server (vulnerable >=1.14.0 <1.14.4). Transitive via
  # @opentelemetry/exporter-logs-otlp-grpc.
  "@grpc/grpc-js": "^1.14.4"
  # @opentelemetry/core: unbounded memory allocation (vulnerable <2.8.0).
  "@opentelemetry/core": "^2.8.0"
  # dompurify: multiple sanitizer-bypass / attribute-pollution advisories
  # through <=3.4.10; patched >=3.4.11. Used by the ui bundle.
  dompurify: "^3.4.11"
  # esbuild: dev-serve arbitrary file read (vulnerable >=0.27.3 <0.28.1).
  # Transitive via tsx / vite.
  esbuild: "^0.28.1"
  # linkify-it: quadratic-time scan-loop DoS in match() (vulnerable
  # <=5.0.0); patched >=5.0.1. Transitive via markdown-it. Lands on
  # 5.0.1 — 5.0.2 is under the 48h minimumReleaseAge gate.
  linkify-it: "^5.0.2"
  # markdown-it: quadratic-complexity DoS in the smartquotes rule
  # (vulnerable <=14.1.1); patched >=14.2.0. Range lands on 14.2.0 —
  # 14.3.0 is under the 48h minimumReleaseAge gate.
  markdown-it: "^14.2.0"
  # undici: TLS cert-validation bypass, WebSocket DoS, cross-origin
  # request routing, Set-Cookie header injection, response-queue
  # poisoning — separate advisory ranges for the v7 and v8 lines.
  # v7 consumers (jsdom et al.) patched >=7.28.0; v8 patched >=8.5.0.
  "undici@>=7.0.0 <8.0.0": "7.28.0"
  "undici@>=8.0.0": "8.5.0"
  # vite: server.fs.deny bypass on Windows alternate data streams +
  # launch-editor NTLMv2 hash disclosure via UNC path (vulnerable
  # >=8.0.0 <=8.0.15); patched >=8.0.16.
  vite: "^8.0.16"
  "@opentelemetry/propagator-jaeger": "^2.9.0"
  "nanoid@5": "^5.1.16"
  "postcss": "^8.5.23"
  "undici@7": "^7.29.0"
  "undici@8": "^8.9.0"
  "body-parser": "^2.3.0"

# packageExtensions add missing peer/optional dependencies the upstream
# package author forgot to declare.  Migrated from the ignored
# package.json `pnpm.packageExtensions`.
packageExtensions:
  "@mariozechner/pi-coding-agent":
    dependencies:
      strip-ansi: "^7.2.0"

# Reserved for source-patched dependencies; empty for now but keep the
# key explicit so a missing block does not look like a missed migration.
patchedDependencies: {}

# Peer-dependency rules — narrow, audited, per-mismatch. Each entry
# below documents WHY the upstream peer requirement is being relaxed
# in this workspace. Do not add a rule here without writing the
# justification next to it.
peerDependencyRules:
  allowedVersions:
    # madge 8.x declares peer typescript@^5.4.4 but the repo has
    # standardised on typescript 6.x for the framework + tooling.
    # madge only runs at dev time (dependency graph reports) and
    # works fine under TS 6 in practice.
    typescript: "*"
    # @vitest/coverage-v8 and vitest are released together but pnpm
    # sometimes resolves them at adjacent patch versions in a
    # workspace this size. Aligning them is a chore for every dep
    # bump; the mismatch has no observable effect on coverage output.
    vitest: "*"
    "@vitest/coverage-v8": "*"
    # prism-media (a transitive of @discordjs/voice) wants the legacy
    # opusscript 0.0.x; the repo has 0.1.1 instead. The Discord
    # channel is not loaded by the executive assistant app — this only matters
    # for operators who wire Discord, and 0.1.x is a drop-in.
    opusscript: "*"
